name: Helm CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/helm-ci.yml"
      - "deploy/helm/**"
      - "decisions/WF-ADR-0059-helm-deployment.md"
      - "docs/managed-gateway-deployment.md"
      - "roadmaps/WF-ROADMAP-0010-verified-efficiency-evidence-engine.md"
  pull_request:
    paths:
      - ".github/workflows/helm-ci.yml"
      - "deploy/helm/**"
      - "decisions/WF-ADR-0059-helm-deployment.md"
      - "docs/managed-gateway-deployment.md"
      - "roadmaps/WF-ROADMAP-0010-verified-efficiency-evidence-engine.md"

permissions:
  contents: read

concurrency:
  group: helm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-render:
    name: Helm lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint chart
        run: helm lint deploy/helm/wayfinder-router --set image.tag=ci-test
      - name: Render bundled Redis form
        shell: bash
        run: |
          set -euo pipefail
          helm template wayfinder deploy/helm/wayfinder-router \
            --namespace wayfinder --set image.tag=ci-test \
            > "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'kind: Deployment' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q -- '--surface' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'value: /etc/wayfinder/wayfinder-router.toml' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'value: /var/lib/wayfinder/wayfinder-audit.jsonl' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'value: /var/lib/wayfinder/wayfinder-savings.json' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'name: runtime-state' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'mountPath: /var/lib/wayfinder' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'mountPath: /etc/wayfinder' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          if grep -q 'subPath:' "$RUNNER_TEMP/wayfinder-bundled.yaml"; then
            echo "::error::configuration still uses a stale subPath mount"
            exit 1
          fi
          grep -q 'kind: StatefulSet' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q -- '--appendonly' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q -- '--appendfsync' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'volumeClaimTemplates:' "$RUNNER_TEMP/wayfinder-bundled.yaml"
          grep -q 'kind: NetworkPolicy' "$RUNNER_TEMP/wayfinder-bundled.yaml"
      - name: Render external configuration and ingress form
        shell: bash
        run: |
          set -euo pipefail
          helm template wayfinder deploy/helm/wayfinder-router \
            --namespace wayfinder \
            --set config.existingSecret=router-config \
            --set credentials.existingSecret=router-credentials \
            --set redis.enabled=false \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set image.tag=ci-test \
            > "$RUNNER_TEMP/wayfinder-external.yaml"
          grep -q 'kind: Ingress' "$RUNNER_TEMP/wayfinder-external.yaml"
          grep -q 'secretName: router-config' "$RUNNER_TEMP/wayfinder-external.yaml"
          grep -q 'name: router-credentials' "$RUNNER_TEMP/wayfinder-external.yaml"
          if grep -q 'kind: ConfigMap' "$RUNNER_TEMP/wayfinder-external.yaml"; then
            echo "::error::external configuration unexpectedly rendered a ConfigMap"
            exit 1
          fi
          if grep -q 'kind: StatefulSet' "$RUNNER_TEMP/wayfinder-external.yaml"; then
            echo "::error::external Redis unexpectedly rendered the bundled StatefulSet"
            exit 1
          fi
      - name: Render disposable Redis form
        shell: bash
        run: |
          set -euo pipefail
          helm template wayfinder deploy/helm/wayfinder-router \
            --namespace wayfinder --set image.tag=ci-test \
            --set redis.persistence.enabled=false \
            > "$RUNNER_TEMP/wayfinder-disposable.yaml"
          grep -q 'kind: StatefulSet' "$RUNNER_TEMP/wayfinder-disposable.yaml"
          grep -q -- '--appendonly' "$RUNNER_TEMP/wayfinder-disposable.yaml"
          grep -A1 -- '--appendonly' "$RUNNER_TEMP/wayfinder-disposable.yaml" | grep -q '"no"'
          if grep -q 'volumeClaimTemplates:' "$RUNNER_TEMP/wayfinder-disposable.yaml"; then
            echo "::error::disposable Redis unexpectedly rendered a persistent claim"
            exit 1
          fi
      - name: Require an explicit immutable image reference
        shell: bash
        run: |
          set -euo pipefail
          if helm template wayfinder deploy/helm/wayfinder-router \
            --set image.tag= --set image.digest= >/dev/null 2>&1; then
            echo "::error::chart accepted an implicit image reference"
            exit 1
          fi
          helm template wayfinder deploy/helm/wayfinder-router \
            --set image.tag= \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > "$RUNNER_TEMP/wayfinder-digest.yaml"
          grep -q 'ghcr.io/asdecided/wayfinder-router@sha256:aaaaaaaa' "$RUNNER_TEMP/wayfinder-digest.yaml"
          if helm template wayfinder deploy/helm/wayfinder-router \
            --set image.digest=sha256:not-a-digest >/dev/null 2>&1; then
            echo "::error::chart accepted a malformed image digest"
            exit 1
          fi
