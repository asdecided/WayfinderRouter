apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wayfinder-router.fullname" . }}
  labels:
    {{- include "wayfinder-router.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "wayfinder-router.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wayfinder-router.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "wayfinder-router.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wayfinder-router
          image: {{ include "wayfinder-router.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - serve
            - --surface
            - data-plane
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.service.port | quote }}
            - --config
            - /etc/wayfinder/wayfinder-router.toml
          env:
            - name: WAYFINDER_CONFIG
              value: /etc/wayfinder/wayfinder-router.toml
            {{- if .Values.otel.enabled }}
            - name: WAYFINDER_ROUTER_OTEL
              value: "1"
            {{- end }}
            {{- if .Values.otel.jsonLogs }}
            - name: WAYFINDER_ROUTER_JSON_LOGS
              value: "1"
            {{- end }}
            {{- if .Values.otel.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
          {{- with .Values.credentials.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/wayfinder/wayfinder-router.toml
              subPath: wayfinder-router.toml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          {{- if .Values.config.existingSecret }}
          secret:
            secretName: {{ .Values.config.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.config.existingSecretKey }}
                path: wayfinder-router.toml
          {{- else if .Values.config.existingConfigMap }}
          configMap:
            name: {{ .Values.config.existingConfigMap }}
            items:
              - key: {{ .Values.config.existingConfigMapKey }}
                path: wayfinder-router.toml
          {{- else }}
          configMap:
            name: {{ include "wayfinder-router.fullname" . }}-config
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
