{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "wayfinder-router.fullname" . }}
  labels:
    {{- include "wayfinder-router.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "wayfinder-router.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingress }}
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
    {{- else }}
    # Any namespace may reach the authenticated data-plane service. Use the
    # values override to restrict callers to a known namespace/selector.
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress }}
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
    {{- else }}
    # DNS is required for provider and Redis hostnames.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Providers and OTLP exporters normally use HTTPS.
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- if .Values.redis.enabled }}
    - ports:
        - protocol: TCP
          port: {{ .Values.redis.port }}
    {{- end }}
    {{- end }}
{{- end }}
