name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest and package
        run: node scripts/validate.mjs
      - name: Validate compatibility contract
        run: node scripts/validate-compatibility.mjs
      - name: Test presentation model
        run: node test/model.test.mjs
      - name: Test pinned native Router installation
        run: bash test/install.test.sh
      - name: Test atomic Router upgrade and rollback
        run: test/router-lifecycle.test.sh
      - name: Test native Omarchy smoke harness
        run: test/omarchy-native-smoke.test.sh
      - name: Check install and removal scripts
        run: >-
          bash -n install.sh uninstall.sh scripts/router-lifecycle.sh
          scripts/validate-omarchy-contract.sh scripts/omarchy-native-smoke.sh
          test/install.test.sh test/router-lifecycle.test.sh
          test/omarchy-native-smoke.test.sh

  omarchy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the reviewed Omarchy source pin
        id: omarchy-ref
        working-directory: plugin
        run: |
          commit="$(node -p 'require("./compatibility.json").omarchy.commit')"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the supported Omarchy contract
        uses: actions/checkout@v4
        with:
          repository: basecamp/omarchy
          ref: ${{ steps.omarchy-ref.outputs.commit }}
          fetch-depth: 0
          path: omarchy-source
          persist-credentials: false
      - name: Validate against the official Omarchy contract
        run: plugin/scripts/validate-omarchy-contract.sh omarchy-source

  coding-agent-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: asdecided/WayfinderRouter
          ref: 07834d7bebb7788ed47fd7e79c90ec9832c15180
          path: .router-source
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install coding-agent contract versions
        run: |
          npm install --global @openai/codex@0.149.0 @anthropic-ai/claude-code@2.1.241
          npm install --prefix "$RUNNER_TEMP/opencode" opencode-linux-x64@1.18.21
      - name: Build the candidate Router contract
        run: cargo build --locked --manifest-path .router-source/rust/Cargo.toml --bin wayfinder-router
      - name: Run a real Codex tool round-trip
        env:
          WAYFINDER_ROUTER_BIN: ${{ github.workspace }}/.router-source/rust/target/debug/wayfinder-router
          WAYFINDER_CODEX_SANDBOX: danger-full-access
        run: bash test/codex-smoke.sh
      - name: Run a real Claude Code tool round-trip
        env:
          WAYFINDER_ROUTER_BIN: ${{ github.workspace }}/.router-source/rust/target/debug/wayfinder-router
        run: bash test/claude-code-smoke.sh
      - name: Run a real OpenCode tool round-trip
        env:
          WAYFINDER_ROUTER_BIN: ${{ github.workspace }}/.router-source/rust/target/debug/wayfinder-router
          OPENCODE_BIN: ${{ runner.temp }}/opencode/node_modules/opencode-linux-x64/bin/opencode
        run: bash test/opencode-smoke.sh
