# Example managed deployment. Copy config/wayfinder-router.toml, add at least
# one virtual key and model, then run `docker compose up gateway`.
#
# Point your app's OpenAI-compatible client at http://localhost:8088/v1.
# Configuration is mounted read-only. Audit and savings state use a separate
# writable volume. Provider keys come from environment variables referenced by
# name in the TOML and are never stored in the image.

services:
  gateway:
    build: .
    ports:
      - "8088:8088"
    volumes:
      - ./config:/etc/wayfinder:ro
      - wayfinder-state:/var/lib/wayfinder
    environment:
      # The names here must match the api_key_env values in wayfinder-router.toml.
      - EXAMPLE_API_KEY=${EXAMPLE_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  wayfinder-state:
