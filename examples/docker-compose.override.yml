# Run Wayfinder Router alongside LibreChat with zero forking.
#
# Copy this into your LibreChat checkout as docker-compose.override.yml (next to
# LibreChat's own docker-compose.yml — Compose merges the two automatically), copy
# examples/librechat.yaml there as ./librechat.yaml, drop your routing config in
# ./wayfinder-config/wayfinder-router.toml, export WAYFINDER_VIRTUAL_KEY, then
# `docker compose up`. LibreChat then
# offers a "Wayfinder" endpoint whose model dropdown picks the routing mode per
# conversation.

services:
  # LibreChat's app service — extend it to mount the Wayfinder endpoint config and
  # wait for the gateway.
  api:
    volumes:
      - ./librechat.yaml:/app/librechat.yaml
    depends_on:
      - wayfinder
    # On Linux, only if you point baseURL at the host instead of the `wayfinder`
    # service name:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # The native managed data plane (WF-ADR-0050). Pin an immutable released image
  # in production; this source build is intended for local evaluation.
  wayfinder:
    build: https://github.com/asdecided/WayfinderRouter.git
    expose:
      - "8088"                       # reachable on the compose network as wayfinder:8088
    volumes:
      - ./wayfinder-config:/etc/wayfinder:ro
      - wayfinder-state:/var/lib/wayfinder
    environment:
      # Names here must match the api_key_env values in your wayfinder-router.toml.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  wayfinder-state:
