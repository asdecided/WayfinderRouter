weights = { word_count = 0.397, heading_count = 0.048, max_heading_depth = 0.166, list_item_count = 0.204, link_count = 0.0, code_block_count = 0.294, table_row_count = 0.233, reasoning_term_count = 2.22, math_symbol_count = 0.0, constraint_term_count = 0.34, question_count = 0.0 }

