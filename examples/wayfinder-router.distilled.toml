# Wayfinder routing recipe — DISTILLED lexical opt-in.
#
# Generated by benchmarks/distill_lexicon.py from a labelled train split, using an
# embedding model at CALIBRATION TIME ONLY. Loading this file adds no model call, no
# network access and no credential to the scored request path (WF-ADR-0001) — it is a
# word list and a weight vector, evaluated by the same pure scorer as every other config.
#
# Held-out on 154 independently-authored prompts, fitted on 60 author-written ones
# (benchmarks/lexical-distillation.md):
#
#   built-in lexicon + fitted weights:  skill +0.098,  recall 16%, precision 1.00
#   THIS artifact (1,940 terms):        skill +0.213,  recall 61%, precision 0.97
#   paired bootstrap Δskill +0.116, 95% CI [+0.068, +0.167]
#
# The threshold below was fitted on that train split and is NOT a universal constant.
# Recalibrate it to your own traffic — the shipped 0.5 default and the 0.09 in
# wayfinder-router.lexical.toml both route 0/154 of this corpus to cloud.
#
# Caveats worth reading before adopting: one corpus, by-construction labels, and skill
# was still rising when the loader's 2,000-term ceiling was reached.

